<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Request received | BrightLine</title><link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f9fc;--card:#fff;--ink:#12263f;--mute:#5b6b80;--teal:#12b5a5;--indigo:#4f5bd5;--amber:#ffb23f;--line:#e3eaf2;--r:20px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;overflow-x:hidden}
h1,h2,h3{font-family:Outfit,sans-serif;line-height:1.15}
a{color:inherit;text-decoration:none}
.wrap{max-width:1140px;margin:auto;padding:0 24px}
section{padding:96px 0;position:relative}
.tag{display:inline-block;font:600 .8rem Outfit;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:12px}
h2{font-size:clamp(1.9rem,4vw,2.7rem);margin-bottom:14px}
.lead{color:var(--mute);max-width:620px;font-size:1.08rem}
.btn{display:inline-block;padding:14px 28px;border-radius:999px;font:600 1rem Outfit;border:0;cursor:pointer;transition:.25s}
.btn-p{background:linear-gradient(135deg,var(--teal),var(--indigo));color:#fff;box-shadow:0 10px 24px -8px rgba(79,91,213,.55)}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 16px 30px -8px rgba(79,91,213,.6)}
.btn-g{background:#fff;border:1.5px solid var(--line)}
.btn-g:hover{border-color:var(--teal);transform:translateY(-3px)}


body{display:grid;place-items:center;min-height:100vh;text-align:center;background:radial-gradient(800px 500px at 80% 0,#dff6f2,transparent 60%),radial-gradient(700px 500px at 0 100%,#e6e9ff,transparent 60%),var(--bg)}
.box{max-width:520px;padding:24px}.box img{width:260px;margin-bottom:28px}.box h1{font-size:2.2rem;margin-bottom:12px}.box p{color:var(--mute);margin-bottom:28px}
</style></head><body><div class="box"><img src="logo.svg" alt="BrightLine">
<h1>Thank you, request received</h1>
<p>We will contact you within one business day to discuss your needs. If it is urgent, email us directly at mohab.r.2022@gmail.com.</p>
<a href="index.html" class="btn btn-p">Back to the website</a></div></body></html>
